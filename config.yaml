# AutoRE Configuration

# LLM settings
llm:
  model: "gpt-4.1"  # Model to use (gpt-4, gpt-3.5-turbo, etc.)
  temperature: 0.7  # Temperature for response generation (0.0-1.0)
  max_tokens: 16000  # Maximum tokens per response

# Alloy Analyzer settings
alloy:
  jar_path: "tools/alloy-6.2.0.jar"
  execution_timeout: 300  # seconds

# Workflow settings
workflow:
  max_iterations: 10
  auto_iterate: false  # If true, won't wait for user feedback

# File paths
paths:
  requirements_dir: "Output/ReqsDoc"
  models_dir: "Output/AlloyModels"
  output_dir: "Output/AnalyzerOutput"
  memory_dir: "memory"

# Agent settings
agents:
  requirement_engineer:
    name: "RequirementEngineer"
    profile: "Requirement Engineer"
    max_lessons_to_remember: 10

  evaluator:
    name: "Evaluator"
    profile: "Requirements Evaluator"
    max_feedback_history: 5

  memory_assistant:
    name: "MemoryAssistant"
    model: "gpt-4o-mini"  
    enabled: true

# Memory system settings
memory:
  semantic_deduplication:
    enabled: true
    # In the merge band the MemoryAssistant classifies the pair BEFORE anything
    # is written: SAME/COMPLEMENTARY fold into one row (the pre-merge wording is
    # kept in `prior_text`, so the merge is revertible), CONTRADICTORY keeps both
    # rows and suspends the older one until the outcome decides. The bands are
    # per-collection because the collections are: lessons are scoped to one
    # {agent, action}, conventions are model-wide.
    merge_threshold: 0.7    # sim in [merge_threshold, drop_threshold) -> classify
    drop_threshold: 0.91    # sim >= drop_threshold -> drop new as duplicate
    merge_similar_lessons: true  # false collapses the merge band to "drop"
    lesson_mode: "active"   # "observe" = classify nothing, act on nothing, still log
    # The convention floor is 0.78, not 0.7: calibrated on
    # Output/ConventionDedup/shadow.jsonl, where every pair below ~0.78 was the
    # same topic under a DIFFERENT rule (an eligibility condition vs an encoding
    # style) and every pair above it was one rule restated or one rule
    # superseding another - the two cases the classifier exists to separate.
    convention_mode: "active"          # "observe" = log the band and verdict, act on nothing
    convention_merge_threshold: 0.78   # sim in [merge, drop) -> classify
    convention_drop_threshold: 0.93    # sim >= drop -> drop new as duplicate
    # A CONTRADICTORY verdict suspends the older item pending an outcome. Most
    # lesson store sites have no outcome to report, so the wait is BOUNDED: past
    # this many iterations the older lesson is restored and both are injected
    # again. Must exceed the lesson probation window (3), or the sweep would
    # pre-empt the answer it is waiting for. Every decision - suspended,
    # finalized, restored, expired - is written with BOTH texts to
    # Output/LessonDedup/decisions.jsonl.
    lesson_conflict_max_wait: 5

# Requirement lifecycle settings
requirements:
  # Contradiction triage (bucket 6). A CONTRADICTS verdict is the Evaluator's
  # reading of two pieces of English, not a solver finding - so neither mode
  # acts on it. The update is applied and VERIFICATION settles whether the two
  # requirements can coexist; the decision is asked then, with evidence.
  # "observe" = record it to Output/RequirementConflict/shadow.jsonl, show
  #             nothing | "active" = also flag the claim to the user and attach
  #             it to the update, so a later contest can cite it
  conflict_mode: "active"

# Embedding model settings (for semantic similarity)
embeddings:
  device: "auto"  # Options: "cpu", "cuda", "auto" (auto will use GPU if available, fallback to CPU)
  model_name: "all-MiniLM-L6-v2"  # SentenceTransformer model for embeddings

# User interaction (CLI-based)
user_interaction:
  mode: "cli"  # CLI-based interaction
  response_timeout: 1200  # seconds (20 minutes) - system proceeds with no feedback after timeout
  multiline_input: true  # Allow multi-line input (end with 'END')
  log_directory: "Output/outputlog"  # Directory for session logs (format: MMDDYY.log)