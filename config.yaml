# AutoRE Configuration

# LLM settings
llm:
  model: "gpt-4.1"  # Model to use (gpt-4, gpt-3.5-turbo, etc.)
  temperature: 0.7  # Temperature for response generation (0.0-1.0)
  max_tokens: 16000  # Maximum tokens per response

# Alloy Analyzer settings
alloy:
  jar_path: "tools/alloy-6.2.0.jar"
  execution_timeout: 300  # seconds

# Workflow settings
workflow:
  max_iterations: 10
  auto_iterate: false  # If true, won't wait for user feedback

# File paths
paths:
  requirements_dir: "Output/ReqsDoc"
  models_dir: "Output/AlloyModels"
  output_dir: "Output/AnalyzerOutput"
  memory_dir: "memory"

# Agent settings
agents:
  requirement_engineer:
    name: "RequirementEngineer"
    profile: "Requirement Engineer"
    max_lessons_to_remember: 10

  evaluator:
    name: "Evaluator"
    profile: "Requirements Evaluator"
    max_feedback_history: 5

  memory_assistant:
    name: "MemoryAssistant"
    model: "gpt-4o-mini"  
    enabled: true

# Memory system settings
memory:
  semantic_deduplication:
    enabled: true
    merge_threshold: 0.7    # sim in [merge_threshold, drop_threshold) -> merge new with existing
    drop_threshold: 0.91    # sim >= drop_threshold -> drop new as duplicate
    merge_similar_lessons: true  # Use MemoryAssistant to merge (for the merge band)

# Embedding model settings (for semantic similarity)
embeddings:
  device: "auto"  # Options: "cpu", "cuda", "auto" (auto will use GPU if available, fallback to CPU)
  model_name: "all-MiniLM-L6-v2"  # SentenceTransformer model for embeddings

# User interaction (CLI-based)
user_interaction:
  mode: "cli"  # CLI-based interaction
  response_timeout: 1200  # seconds (20 minutes) - system proceeds with no feedback after timeout
  multiline_input: true  # Allow multi-line input (end with 'END')
  log_directory: "Output/outputlog"  # Directory for session logs (format: MMDDYY.log)